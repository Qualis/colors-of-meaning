[metadata]
name = colors-of-meaning
description = Machine synesthesia for semantic compression and retrieval — sentence embeddings as CIE-Lab colours
author = SVO
author_email = svo@qual.is
license = MIT
license_files = LICENSE.txt
long_description = file: README.MD
long_description_content_type = text/markdown; charset=UTF-8
url = https://github.com/Qualis/colors-of-meaning
project_urls =
    Source = https://github.com/Qualis/colors-of-meaning
    Article = https://www.qual.is/posts/colors-of-meaning

platforms = any

classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python

[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    = src
    resources = resources

python_requires = >=3.11

install_requires =
    anthropic
    argon2-cffi
    click
    datasets
    hnswlib
    fastapi
    fastapi-health
    lagom
    matplotlib
    numpy
    pillow
    pot
    pydantic
    pydantic-settings
    pyyaml
    scikit-learn
    scipy
    sentence-transformers
    torch
    torchmetrics
    tyro
    uvicorn[standard]

[options.packages.find]
where = src
exclude =
    tests

[options.extras_require]
testing =
    assertpy
    bandit
    httpx
    mypy
    pip-audit
    pytest
    pytest-archon
    pytest-benchmark
    pytest-cov
    pytest-mock
    pytest-order
    pytest-random-order
    pytest-testmon
    pytest-watch
    ruff
    setuptools
    xenon

[options.entry_points]

[tool:pytest]
addopts =
    --verbose
    -m "not benchmark"
norecursedirs =
    .tox
    .vagrant
    build
    dist
testpaths = tests

filterwarnings =
    ignore:Deprecated call to \`pkg_resources.declare_namespace:DeprecationWarning

markers =
    integration: integration tests
    benchmark: performance benchmark tests

[devpi:upload]
no_vcs = 1
formats = bdist_wheel

[pyscaffold]
version = 4.4.1
package = colors_of_meaning
