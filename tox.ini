[tox]
min_version = 4.52.1
envlist = default
toxworkdir = /tmp/.tox
requires =
    tox>=4.52.1,<5
    tox-uv>=1.36.0

[testenv]
description = Invoke pytest to run automated tests
runner = uv-venv-lock-runner
package = wheel
uv_sync_flags = --compile-bytecode
allowlist_externals =
    semgrep
    {toxinidir}/bin/audit-torch
setenv =
    TOXINIDIR = {toxinidir}
    PYTHONPATH = {toxinidir}
passenv =
    HOME
    SETUPTOOLS_*
extras =
    testing
commands =
    ruff check .
    ruff format --check .
    bandit -r src
    semgrep scan --config p/default --error .
    pip-audit --ignore-vuln PYSEC-2026-3447 --ignore-vuln PYSEC-2025-194
    {toxinidir}/bin/audit-torch --ignore-vuln PYSEC-2026-3447 --ignore-vuln PYSEC-2025-194
    radon cc . -a -s -nb
    xenon --max-absolute A --max-modules A --max-average A --exclude ".claude/*,.vagrant/*" .
    mypy src
    pytest --junitxml=build/pytest.xml -m "" --random-order --cov colors_of_meaning --cov-fail-under=100 --cov-report term-missing --cov-report xml --cov-config=.coveragerc -W error -W ignore::starlette.exceptions.StarletteDeprecationWarning {posargs}

[testenv:format]
description = Format code
changedir = {toxinidir}
commands =
    - ruff check --fix .
    ruff format .

[testenv:watch]
description = Watch for file changes and invoke pytest to run automated tests as need
changedir = {toxinidir}
package = editable
setenv =
    TESTMON_DATAFILE = {envdir}/.testmon
commands =
    ptw --poll --runner "pytest --testmon --random-order" {posargs}

[testenv:cli]
description = Run the CLI interface
changedir = {toxinidir}
package = editable
commands =
    colors-of-meaning-cli {posargs}

[testenv:train]
description = Train the embedding-to-color projector
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.train {posargs}

[testenv:encode]
description = Encode documents to color histograms
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.encode {posargs}

[testenv:compare]
description = Compare documents via color distance
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.compare {posargs}

[testenv:compress]
description = Analyze compression ratios of encoded documents
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.compress {posargs}

[testenv:eval]
description = Evaluate classification performance
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.eval {posargs}

[testenv:visualize]
description = Generate visualizations (codebook, histograms, projections, confusion matrices)
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.visualize {posargs}

[testenv:eval_suite]
description = Run the fidelity-gated, multi-dataset scaled evaluation and write reports/eval_results.md
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.eval_suite {posargs}

[testenv:visualize_corpus]
description = Render color-signature and t-SNE figures comparing labelled text corpora
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.visualize_corpus {posargs}

[testenv:visualize_documents]
description = Regenerate the authored-corpus colour figures (t-SNE, per-author signatures, per-book A4 sheets, A4 gallery)
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.visualize_documents {posargs}

[testenv:query]
description = Query documents by color palette
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.query {posargs}

[testenv:encode_image]
description = Encode a document as an A4 colors-of-meaning image
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.encode_image {posargs}

[testenv:decode_image]
description = Decode an A4 colors-of-meaning image to a histogram and retrieve its source document
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.decode_image {posargs}

[testenv:encode_lossless]
description = Encode a document losslessly into printable A4 color-barcode page(s)
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.encode_lossless {posargs}

[testenv:decode_lossless]
description = Decode lossless A4 color-barcode page(s) back into the exact source text
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.decode_lossless {posargs}

[testenv:ablate]
description = Sweep quantization level against distance metric
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.ablate {posargs}

[testenv:interpretability]
description = Validate the structured mapper interpretability axes on a held-out split against a negative control
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.interpretability {posargs}

[testenv:rate_distortion]
description = Sweep the bit budget to plot the rate-distortion (and rate-accuracy) frontier against gzip and PQ
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.rate_distortion {posargs}

[testenv:compass]
description = Read a story outline as a measured colour trajectory (arc, drift, coherence) and write reports/story_compass.md
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.compass {posargs}

[testenv:grounding]
description = Audit RAG answers for colour-distribution drift from their retrieved context and write reports/grounding_audit.md
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.grounding {posargs}

[testenv:authorship]
description = Write reports/documents_authorship.md computed tables from a held-out authored-corpus train/eval (--refresh-scaling re-runs the sweep; non-CI, long-running)
changedir = {toxinidir}
package = editable
commands =
    python -m colors_of_meaning.interface.cli.authorship {posargs}

[testenv:generate]
description = Generate a book from a summary with an LLM while the colour compass audits coherence drift (requires ANTHROPIC_API_KEY; not run in CI)
changedir = {toxinidir}
package = editable
passenv =
    ANTHROPIC_API_KEY
    ANTHROPIC_AUTH_TOKEN
    ANTHROPIC_BASE_URL
    ANTHROPIC_PROFILE
    ANTHROPIC_CONFIG_DIR
    HOME
    SETUPTOOLS_*
commands =
    python -m colors_of_meaning.interface.cli.generate {posargs}

[testenv:clean]
description = Remove old distribution files and temporary build artifacts (./build and ./dist)
runner = uv-venv-runner
skip_install = True
changedir = {toxinidir}
extras =
commands =
    python -c 'import shutil; [shutil.rmtree(p, True) for p in ("build", "dist", "docs/_build")]'
    python -c 'import pathlib, shutil; [shutil.rmtree(p, True) for p in pathlib.Path("src").glob("*.egg-info")]'

[testenv:build]
description = Build the package in isolation according to PEP517, see https://github.com/pypa/build
skip_install = True
changedir = {toxinidir}
extras =
only_groups = build
passenv =
    SETUPTOOLS_*
commands =
    python -m build {posargs}

[testenv:publish]
description =
    Publish the package you have been developing to a package index server.
    By default, it uses testpypi. If you really want to publish your package
    to be publicly accessible in PyPI, use the `-- --repository pypi` option.
skip_install = True
changedir = {toxinidir}
extras =
only_groups = publish
passenv =
    TWINE_USERNAME
    TWINE_PASSWORD
    TWINE_REPOSITORY
    TWINE_REPOSITORY_URL
commands =
    python -m twine check dist/*
    python -m twine upload {posargs:--repository {env:TWINE_REPOSITORY:testpypi}} dist/*
