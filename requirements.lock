# requirements.lock — pinned, reproducible dependency closure for the quality gate.
#
# Provenance: frozen from the validated green tox environment (project + `testing`
# extra). Consumed by tox as an install constraint (`-c requirements.lock`) so every
# gate run resolves these exact versions while setup.cfg keeps abstract ranges for
# library installs. Regenerate by re-freezing a green env; bump via Dependabot (pip).
#
# Deliberately excluded, with rationale:
#   - colors-of-meaning* (the project itself; a constraint file must not pin the target)
#   - nvidia-*, triton (torch-version-determined CUDA/compiler transitive deps; pinning
#     torch fixes them per-platform, so hard-pinning here would break cross-platform CI)
#
# semgrep is pinned at its install sites (CI workflow / builder image) and its ruleset
# in tox.ini, not here, to keep its dependency tree from conflicting with these pins.

