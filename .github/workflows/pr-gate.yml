name: PR Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - id: setup-python
        name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - id: setup-uv
        name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - id: install-gate-tools
        name: Install gate tools
        run: |
          uv tool install --python 3.11 --with "tox-uv>=1.36.0" "tox>=4.52.1,<5"
          uv tool install --with "ansible==12.3.0" "ansible-lint==26.8.0"
          uv tool install semgrep==1.164.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: ansible-lint
        name: Ansible Lint
        run: ansible-lint --format=pep8 infrastructure/ansible/playbook-*.yml

      - id: shellcheck
        name: ShellCheck
        run: shellcheck -x ./*.sh bin/*

      - id: tox
        name: Tox quality gate
        run: tox

      - id: pytest-upload
        name: Pytest:Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytest
          path: build/pytest.xml
        if: ${{ always() }}
