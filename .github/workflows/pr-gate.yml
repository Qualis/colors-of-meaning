name: PR Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - id: setup-python
        name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - id: install-gate-tools
        name: Install gate tools
        run: |
          python -m pip install --upgrade pip
          pip install "tox>=3.28.0,<4" tox-recreate ansible-lint semgrep==1.164.0

      - id: ansible-lint
        name: Ansible Lint
        run: ansible-lint -p infrastructure/ansible/playbook-*.yml

      - id: shellcheck
        name: ShellCheck
        run: shellcheck -x ./*.sh bin/*

      - id: tox
        name: Tox quality gate
        run: tox

      - id: pytest-upload
        name: Pytest:Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pytest
          path: build/pytest.xml
        if: ${{ always() }}
